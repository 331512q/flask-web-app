name: Deploy Flask App to Touge Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.4.1
          pytest tests/ -v
        continue-on-error: false

      - name: Deploy to Touge Server via SSH
        env:
          TOUGE_SSH_PRIVATE_KEY: ${{ secrets.TOUGE_SSH_PRIVATE_KEY }}
          TOUGE_SERVER_IP: ${{ secrets.TOUGE_SERVER_IP }}
          TOUGE_SSH_PORT: ${{ secrets.TOUGE_SSH_PORT }}
          TOUGE_SSH_USER: ${{ secrets.TOUGE_SSH_USER }}
        run: |
          # 配置 SSH 环境（强制兼容旧版 RSA 私钥）
          mkdir -p ~/.ssh
          printf "%s\n" "$TOUGE_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$TOUGE_SSH_PORT" -H "$TOUGE_SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH 环境配置完成，尝试连接服务器..."
          set -e
          ssh -p "$TOUGE_SSH_PORT" \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=20 \
              -o HostKeyAlgorithms=+ssh-rsa \
              -o PubkeyAcceptedAlgorithms=+ssh-rsa \
              -i ~/.ssh/id_rsa \
              "$TOUGE_SSH_USER@$TOUGE_SERVER_IP" 'bash -s' <<'REMOTE'
          set -e
          echo "成功连接服务器: $(whoami)@$(hostname)"
          cd /root/flask-web-app || { echo "项目目录不存在"; exit 1; }
          git pull origin main || { echo "Git拉取失败"; exit 1; }
          pip3 install -r requirements.txt || pip3 install --break-system-packages -r requirements.txt || { echo "依赖安装失败"; exit 1; }
          supervisorctl restart flask-web-app || { echo "应用重启失败"; exit 1; }
          sleep 2
          supervisorctl status flask-web-app
          echo "部署完成"
          REMOTE
